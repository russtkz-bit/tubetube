[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tubetube"
version = "0.1.0"
description = "Скачивание субтитров с видео и плейлистов YouTube (Windows/Linux)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "yt-dlp>=2024.1.1",
]

[project.scripts]
tubetube = "tubetube.cli:main"

[tool.setuptools.packages.find]
include = ["tubetube*"]
